# Attaches the Docusaurus theme tarball to a GitHub release. Docs sites install it by URL:
#   npm i https://github.com/mygamedevtools/design-system/releases/download/vX.Y.Z/mygamedevtools-docusaurus-theme-X.Y.Z.tgz
# Nothing is published to npm. The release tag must match the theme's package.json version.
name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  theme-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches the theme version
        run: |
          version=$(node -p "require('./packages/docusaurus-theme/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} doesn't match theme version v${version}" >&2
            exit 1
          fi

      - run: npm run release:pack

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/release/*.tgz --clobber
