<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Asset Store screenshot (2400×1600)</title>
  <!-- Unity: screenshots at least 1200px wide; 2400×1600 recommended. Keep captions short. -->
  <link rel="stylesheet" href="../template.css">
  <style>
    body { width: 2400px; height: 1600px; padding: 100px 120px 120px; display: flex; flex-direction: column; gap: 56px; }
    .eyebrow { display: flex; align-items: center; gap: 20px; font-size: 26px; color: var(--mgt-color-accent); }
    .bars { display: flex; gap: 8px; }
    .bars i { width: 52px; height: 12px; background: var(--mgt-color-stripe-1); }
    .bars i:nth-child(2) { background: var(--mgt-color-stripe-2); }
    .bars i:nth-child(3) { background: var(--mgt-color-stripe-3); }
    h1 { font-size: 92px; margin-top: 24px; max-width: 1150px; text-transform: none; }
    .frame { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
    .shot { border-radius: 24px; border: 2px solid var(--mgt-color-border); box-shadow: 0 40px 120px rgba(0, 0, 0, 0.45); }
  </style>
  <script type="module" src="../template.js"></script>
</head>
<body data-stripes>
  <header class="content">
    <div class="eyebrow label"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span data-param="eyebrow">My Scene Manager</span></div>
    <h1 class="display" data-param="caption">Loading screens from scenes, prefabs or UI Toolkit.</h1>
  </header>
  <div class="content frame"><img class="shot" data-param-src="image" data-fit alt=""></div>
</body>
</html>
