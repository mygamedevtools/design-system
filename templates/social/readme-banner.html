<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>README banner (1280×320)</title>
  <link rel="stylesheet" href="../template.css">
  <style>
    body { width: 1280px; height: 320px; padding: 56px 64px; display: flex; flex-direction: column; justify-content: space-between; }
    .lockup { height: 36px; }
    h1 { font-size: 72px; }
    .tagline { margin: 14px 0 0; font-size: 22px; color: var(--mgt-color-text-muted); }
  </style>
  <script type="module" src="../template.js"></script>
</head>
<body data-stripes>
  <img class="content lockup" data-logo="lockup-horizontal" alt="My Gamedev Tools">
  <div class="content">
    <h1 class="display" data-param="name">Scene Loader</h1>
    <p class="tagline" data-param="tagline" data-hide-empty>Load, unload and transition Unity scenes in one line.</p>
  </div>
</body>
</html>
